name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The renderer core has no windowing dependency, so the tests build headless and
      # need no display or GL packages. Building the viewer is a separate job.
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPT_BUILD_VIEWER=OFF \
            -DPT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A failing golden test is much easier to judge by eye than by numbers.
      - name: Upload rendered output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-output-${{ matrix.build_type }}
          path: |
            build/tests/*.png
            tests/golden/*.png
          if-no-files-found: ignore

  gpu:
    name: Build GPU support
    runs-on: ubuntu-latest

    # There is no NVIDIA GPU on a hosted runner, so this cannot run anything. It compiles
    # and links, which is the part that rots silently: without it, no GPU code would ever
    # be built by CI at all. Linking works without a driver because the build links the
    # CUDA stub library, which exports the driver API entry points and resolves against
    # the real driver only at run time.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch the CUDA and OptiX headers
        run: scripts/setup-gpu-deps.sh

      # As elsewhere, a missing dependency downgrades to a build without the feature
      # rather than failing, which would let this job pass without compiling any of it.
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DPT_BUILD_VIEWER=OFF -DPT_BUILD_TESTS=ON -DPT_ENABLE_GPU=ON 2>&1 | tee configure.log
          grep -q 'gpu         = ON' configure.log \
            || { echo "::error::GPU support was not enabled; its dependencies are missing"; exit 1; }

      # Tests are built but not run: device_parity needs a GPU to run and only a
      # compiler to be kept honest, and building it is what stops the device side of the
      # shared maths from rotting between GPU sessions.
      - name: Build
        run: cmake --build build -j$(nproc)

      # The binary cannot be run here. It links libcuda.so.1, which ships with the
      # display driver and so does not exist on a hosted runner -- the stub satisfies the
      # linker, not the loader, because the loader searches by file name and the stub is
      # called libcuda.so. So assert the link instead: that the driver API and NVRTC are
      # both recorded as dependencies, which is what would break if the GPU target were
      # silently built without them.
      - name: Check what it linked against
        run: |
          readelf -d build/src/steradian | tee needed.log
          grep -q 'libcuda\.so\.1' needed.log \
            || { echo "::error::the binary does not depend on the CUDA driver API"; exit 1; }
          grep -q 'libnvrtc\.so' needed.log \
            || { echo "::error::the binary does not depend on NVRTC"; exit 1; }

  viewer:
    name: Build viewer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenGL and X11 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      # A missing dependency downgrades the build to headless with a warning rather than
      # failing, which would let this job pass without compiling any viewer code. Assert
      # the viewer really was enabled.
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPT_BUILD_VIEWER=ON 2>&1 | tee configure.log
          grep -q 'viewer      = ON' configure.log \
            || { echo "::error::Viewer was not enabled; GL/X11 dependencies are missing"; exit 1; }

      - name: Build
        run: cmake --build build -j$(nproc)

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          # Vendored stb headers are excluded; they are not ours to reformat.
          # .cu is included: device code is source like any other, and it is the part
          # no compiler in this workflow parses, so nothing else would notice it drifting.
          files=$(find src tests \( -name '*.h' -o -name '*.cpp' -o -name '*.cu' \) \
            | grep -v 'stb_image.h' | grep -v 'stb_image_write.h')
          clang-format --dry-run --Werror $files
